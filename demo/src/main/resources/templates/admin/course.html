<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Course Admin</h2>

<a href="/admin/add">Add</a>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Credits</th>
        <th>Lecturer</th>
        <th>Action</th>
    </tr>

    <tr th:each="c : ${list}">

        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.credits}"></td>
        <td th:text="${c.lecturer}"></td>

        <td>

            <a th:href="@{/admin/edit/{id}(id=${c.id})}">
                Edit
            </a>

            |

            <a th:href="@{/admin/delete/{id}(id=${c.id})}">
                Delete
            </a>

        </td>

    </tr>

</table>

</body>
</html>
