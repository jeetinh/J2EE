<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Register</h2>

<form th:action="@{/register}"
      th:object="${student}"
      method="post">

    Username:
    <input th:field="*{username}" />
    <br>

    Password:
    <input th:field="*{password}" />
    <br>

    Email:
    <input th:field="*{email}" />
    <br>

    <button type="submit">
        Register
    </button>

</form>

<a href="/login">Login</a>

</body>
</html>
