<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf2f2;
        }
        .container {
            width: 800px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #c62828;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #c62828;
            color: white;
            padding: 10px;
        }
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .action-btn {
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .total-row {
            font-weight: bold;
            font-size: 18px;
            color: #c62828;
        }
        .empty-cart {
            text-align: center;
            font-size: 18px;
            color: #555;
            margin: 30px 0;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Giỏ hàng của bạn</h2>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart">
        <p>Giỏ hàng của bạn hiện đang trống.</p>
    </div>

    <table th:unless="${#lists.isEmpty(cartItems)}">
        <thead>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.name}"></td>
            <td th:text="${item.price}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.price * item.quantity}"></td>
            <td>
                <a class="action-btn btn-danger" th:href="@{/cart/remove/{id}(id=${item.productId})}">Xóa</a>
            </td>
        </tr>

        <tr class="total-row">
            <td colspan="3" style="text-align: right; padding-right: 20px;">Tổng tiền thanh toán:</td>
            <td th:text="${totalAmount}"></td>
            <td></td>
        </tr>
        </tbody>
    </table>

    <div class="button-group">
        <a class="action-btn btn-secondary" th:href="@{/products}">← Tiếp tục mua sắm</a>

        <a th:unless="${#lists.isEmpty(cartItems)}" class="action-btn btn-success" th:href="@{/checkout}">Tiến hành Đặt hàng →</a>
    </div>

</div>

</body>
</html>
