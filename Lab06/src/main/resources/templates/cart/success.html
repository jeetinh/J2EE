<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>
    <style>
        body { font-family: Arial; background: #fdf2f2; text-align: center; padding-top: 100px;}

        h1 { color: #28a745; }
        p { font-size: 18px; color: #555;}
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #c62828; color: white; text-decoration: none; border-radius: 4px;}
    </style>
</head>
<body>
<div class="container">
    <h1>🎉 Chúc mừng!</h1>
    <p>Đơn hàng của bạn đã được đặt thành công.</p>
    <p>Chúng tôi sẽ liên hệ để giao hàng sớm nhất.</p>
    <a href="/products">Quay lại Trang chủ</a>
</div>
</body>
</html>
